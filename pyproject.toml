[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "foodarena-ai"
version = "0.1.0"
description = "AI-native food decision application"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-bdd>=7,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
siliconflow-demo = "foodarena_ai.siliconflow:main"
foodarena-api = "foodarena_ai.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/foodarena_ai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection idiom: Depends() in argument defaults.
"src/foodarena_ai/main.py" = ["B008"]
