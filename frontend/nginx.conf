server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA hash routing lives entirely client-side, so no location fallback is
    # needed for #/ routes; a plain fallback keeps deep links working anyway.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the FoodArena API to the backend container on the compose network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;             # SSE must stream un-buffered
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /healthz {
        proxy_pass http://backend:8000/healthz;
    }
}
